<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI 财报智审助手</title>
<link rel="stylesheet" href="/static/css/style.css">
<script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>
<script src="/static/js/main.js"></script>
<style>
.hero-section { margin-bottom: 32px; }
.hero-section h2 { font-size: 26px; font-weight: 700; margin-bottom: 8px; }
.hero-section p { font-size: 15px; color: var(--text-muted); max-width: 540px; }
.features-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; margin: 24px 0; }
.feature-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 20px; }
.feature-card .icon { font-size: 24px; margin-bottom: 8px; }
.feature-card h3 { font-size: 15px; font-weight: 600; margin-bottom: 4px; }
.feature-card p { font-size: 13px; color: var(--text-muted); }
@media (max-width: 640px) { .features-grid { grid-template-columns: 1fr; } }
.no-key-notice { background: #fffbeb; border: 1px solid #fde68a; border-radius: var(--radius); padding: 16px; margin-bottom: 20px; display: none; }
.session-recovery { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; margin-bottom: 20px; display: none; }
</style>
</head>
<body>
<div class="app-container">
  <header class="app-header">
    <a href="/" class="logo">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 12h6"/><path d="M12 9v6"/><rect x="3" y="3" width="18" height="18" rx="2"/></svg>
      <h1>财报智审</h1>
    </a>
    <nav>
      <a href="/" class="active">首页</a>
      <a href="/settings">设置</a>
    </nav>
  </header>
  <main class="app-main">
    <div class="hero-section">
      <h2>AI 财报分析</h2>
      <p>上传上市公司财报 PDF，AI 自动解析并回答你的问题、生成分析图表、导出报告。数据仅存本地，隐私安全。</p>
    </div>
    <div class="features-grid">
      <div class="feature-card">
        <div class="icon">📄</div>
        <h3>上传财报</h3>
        <p>支持 PDF 格式，最大 50MB。自动提取文本和表格。</p>
      </div>
      <div class="feature-card">
        <div class="icon">💬</div>
        <h3>AI 问答</h3>
        <p>直接提问财务数据，AI 引证式回答，标注数据来源页码。</p>
      </div>
      <div class="feature-card">
        <div class="icon">📊</div>
        <h3>图表分析</h3>
        <p>生成交互式 Plotly 图表，一句指令即可。</p>
      </div>
    </div>
    <div id="no-key-notice" class="no-key-notice">
      <strong>⚠️ 尚未配置 API Key</strong>
      <p style="margin-top:4px;font-size:14px;">请先在 <a href="/settings" style="color:var(--primary);">设置页</a> 填入 API Key，AI 才能回答问题。</p>
    </div>
    <div id="session-recovery" class="session-recovery"></div>
    <div class="card" style="margin-bottom:20px;">
      <h3 style="font-size:16px;font-weight:600;margin-bottom:16px;">上传财报 PDF</h3>
      <div id="upload-zone" class="upload-zone">
        <div class="icon">📄</div>
        <div class="title">拖拽 PDF 到此处，或点击选择文件</div>
        <div class="subtitle">支持 .pdf 格式，最大 50MB</div>
        <input type="file" id="file-input" accept=".pdf">
      </div>
      <div id="upload-progress" style="display:none;margin-top:16px;">
        <div class="progress-bar"><div class="fill" style="width:0%;" id="progress-fill"></div></div>
        <div class="text-sm text-muted text-center" id="progress-text">解析中...</div>
      </div>
      <div id="upload-alert" style="margin-top:16px;"></div>
    </div>
    <div id="documents-section" class="card" style="display:none;">
      <h3 style="font-size:16px;font-weight:600;margin-bottom:16px;">已解析的财报</h3>
      <ul id="doc-list" class="doc-list"></ul>
    </div>
  </main>
</div>
<script>
$(function() {
  if (!getApiKey()) $("#no-key-notice").show();
  checkRecovery();
  loadDocuments();
});
// 拖拽上传
const zone = document.getElementById("upload-zone");
const fileInput = document.getElementById("file-input");
zone.addEventListener("click", () => fileInput.click());
zone.addEventListener("dragover", (e) => { e.preventDefault(); zone.classList.add("dragover"); });
zone.addEventListener("dragleave", () => zone.classList.remove("dragover"));
zone.addEventListener("drop", (e) => { e.preventDefault(); zone.classList.remove("dragover"); handleFile(e.dataTransfer.files[0]); });
fileInput.addEventListener("change", () => { if (fileInput.files[0]) handleFile(fileInput.files[0]); });
async function handleFile(file) {
  if (!file || !file.name.toLowerCase().endsWith(".pdf")) {
    showAlert("upload-alert", "error", "仅支持 PDF 文件");
    return;
  }
  if (file.size > 50 * 1024 * 1024) {
    showAlert("upload-alert", "error", "文件超过 50MB 限制");
    return;
  }
  showAlert("upload-alert", "info", `上传中: ${file.name} (${formatBytes(file.size)})`);
  document.getElementById("upload-progress").style.display = "block";
  const fill = document.getElementById("progress-fill");
  const text = document.getElementById("progress-text");
  let progress = 0;
  const interval = setInterval(() => { progress = Math.min(progress + 5, 80); fill.style.width = progress + "%"; }, 500);
  try {
    const formData = new FormData();
    formData.append("file", file);
    const res = await fetch("/api/upload", { method: "POST", body: formData });
    if (!res.ok) { const e = await res.json(); throw new Error(e.detail || "上传失败"); }
    const data = await res.json();
    clearInterval(interval);
    fill.style.width = "100%";
    text.textContent = "解析完成";
    setTimeout(() => { document.getElementById("upload-progress").style.display = "none"; }, 800);
    showAlert("upload-alert", "success", data.message + `（${data.pages}页，${data.chunks}片段）`);
    // 跳转到聊天页
    setTimeout(() => { window.location.href = `/chat/${data.doc_hash}`; }, 500);
  } catch (err) {
    clearInterval(interval);
    document.getElementById("upload-progress").style.display = "none";
    showAlert("upload-alert", "error", err.message);
  }
}
async function loadDocuments() {
  try {
    const data = await api("GET", "/documents");
    if (data.documents && data.documents.length > 0) {
      $("#documents-section").show();
      const list = $("#doc-list");
      list.empty();
      data.documents.forEach(doc => {
        const hash = doc.name.replace("pdf_", "");
        list.append(`
          <li class="doc-item">
            <div class="info">
              <span class="name">📄 财报 ${hash}</span>
              <span class="meta">${doc.count} 片段</span>
            </div>
            <a href="/chat/${hash}" class="btn btn-sm btn-primary">进入分析</a>
          </li>
        `);
      });
    }
  } catch {}
}
function checkRecovery() {
  const snapshots = getStorage("session_snapshots", []);
  if (snapshots.length > 0) {
    const el = $("#session-recovery");
    el.show();
    let html = '<strong>📋 可恢复的会话</strong><div style="margin-top:8px;display:flex;gap:8px;flex-wrap:wrap;">';
    snapshots.forEach((snap, i) => {
      html += `<button class="btn btn-sm" onclick="recoverSession(${i})">${snap.title || "会话 " + (i+1)}</button>`;
    });
    html += '<button class="btn btn-sm btn-danger" onclick="clearSnapshots()">清除所有</button></div>';
    el.html(html);
  }
}
function recoverSession(index) {
  const snapshots = getStorage("session_snapshots", []);
  const snap = snapshots[index];
  if (!snap) return;
  setSession("chat_messages", snap.messages || []);
  if (snap.doc_hash) {
    window.location.href = "/chat/" + snap.doc_hash;
  } else {
    window.location.href = "/chat/recovered";
  }
}
function clearSnapshots() {
  const keys = ["session_snapshots", "auto_backups"];
  keys.forEach(k => localStorage.removeItem(k));
  $("#session-recovery").hide();
}
</script>
</body>
</html>
