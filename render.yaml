services:
  - type: web
    name: ai-finreport
    runtime: python
    region: singapore
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: CHROMA_DATA_PATH
        value: /var/data/chroma
      - key: PORT
        value: 8000
    disk:
      name: chroma-data
      mountPath: /var/data
      sizeGB: 1
    healthCheckPath: /
    autoDeploy: true
